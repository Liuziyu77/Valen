[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visualjev"
version = "0.1.0"
description = "Visual-Jev: multimodal decisions with Qwen3.5, SFT and experimental RLCD"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["torch==2.6.0", "torchvision==0.21.0", "transformers==5.4.0", "peft==0.18.1", "huggingface-hub==1.7.1", "httpx[socks]>=0.28,<1", "Pillow>=10", "av==16.1.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.urls]
Repository = "https://github.com/Liuziyu77/Visual-Jev"
Issues = "https://github.com/Liuziyu77/Visual-Jev/issues"

[tool.setuptools.packages.find]
include = ["visualjev*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
